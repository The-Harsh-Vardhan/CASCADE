<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blast Radius 3D Crystal Lattice Graph Explorer</title>
  
  <!-- CDN Scripts for 3D Force Graph and Three.js -->
  <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
  <script src="https://unpkg.com/3d-force-graph@1.73.0/dist/3d-force-graph.min.js"></script>
  <!-- Local Graph Data JS (Immune to file:// CORS restrictions) -->
  <script src="graph_data.js"></script>


  <style>
    :root[data-theme="dark"] {
      --bg-color: #0b0c10;
      --bg-canvas: #0b0c10;
      --panel-bg: rgba(22, 27, 34, 0.85);
      --panel-border: #30363d;
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      --accent-color: #58a6ff;
      --accent-hover: #1f6feb;
      --card-bg: rgba(33, 38, 45, 0.8);
      --card-hover: rgba(48, 54, 61, 0.9);
      --badge-req: #7f77dd;
      --badge-ui: #1d9e75;
      --badge-code: #ba7517;
      --badge-gap: #a32d2d;
    }

    :root[data-theme="light"] {
      --bg-color: #f8f9fa;
      --bg-canvas: #f8f9fa;
      --panel-bg: rgba(255, 255, 255, 0.9);
      --panel-border: #d0d7de;
      --text-main: #1f2328;
      --text-sub: #656d76;
      --accent-color: #0969da;
      --accent-hover: #0550ae;
      --card-bg: rgba(246, 248, 250, 0.9);
      --card-hover: rgba(234, 238, 242, 0.95);
      --badge-req: #665cd7;
      --badge-ui: #14805e;
      --badge-code: #9e600f;
      --badge-gap: #c93b3b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      transition: background-color 0.3s ease;
    }

    #3d-graph {
      width: 100vw;
      height: 100vh;
      position: absolute;
      top: 0;
      left: 0;
      z-index: 1;
    }

    /* Top Control Bar */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      gap: 12px;
      align-items: center;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 10px 16px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.3);
    }

    .brand-title {
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-title span {
      background: linear-gradient(135deg, #58a6ff, #bc8cff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .stats-badge {
      font-size: 12px;
      color: var(--text-sub);
      background: rgba(255,255,255,0.06);
      padding: 4px 8px;
      border-radius: 6px;
      border: 1px solid var(--panel-border);
    }

    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--panel-border);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background: var(--card-hover);
      border-color: var(--accent-color);
      color: var(--accent-color);
    }

    .btn-primary {
      background: var(--accent-color);
      color: #ffffff;
      border: none;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      color: #ffffff;
    }

    .control-group {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-weight: 500;
      color: var(--text-main);
      background: var(--card-bg);
      padding: 4px 10px;
      border-radius: 8px;
      border: 1px solid var(--panel-border);
    }

    .control-group input[type="range"] {
      width: 80px;
      accent-color: var(--accent-color);
      cursor: pointer;
    }

    /* Camera Preset Controls */
    .camera-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 10;
      display: flex;
      gap: 8px;
      background: var(--panel-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 8px;
      border-radius: 10px;
    }

    /* Right Search & Explorer Sidebar */
    .sidebar {
      position: absolute;
      top: 16px;
      right: 16px;
      bottom: 16px;
      width: 360px;
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      box-shadow: -8px 0 32px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar.collapsed {
      transform: translateX(calc(100% + 20px));
    }

    .sidebar-toggle {
      position: absolute;
      left: -40px;
      top: 16px;
      width: 36px;
      height: 36px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 10px 0 0 10px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .sidebar-header {
      padding: 16px;
      border-bottom: 1px solid var(--panel-border);
    }

    .search-box {
      position: relative;
      margin-top: 10px;
    }

    .search-input {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 8px 12px 8px 32px;
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .search-icon {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      color: var(--text-sub);
    }

    /* Layer Tabs */
    .tabs {
      display: flex;
      gap: 4px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--panel-border);
      overflow-x: auto;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
    }

    .tab-btn:hover {
      color: var(--text-main);
    }

    .tab-btn.active {
      background: var(--card-bg);
      color: var(--accent-color);
      border: 1px solid var(--panel-border);
    }

    /* Node List Scroll Area */
    .node-list {
      flex: 1;
      overflow-y: auto;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .node-card {
      background: var(--card-bg);
      border: 1px solid var(--panel-border);
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .node-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-color);
      transform: translateY(-1px);
    }

    .node-card-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .node-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 6px;
      border-radius: 4px;
      color: #ffffff;
      text-transform: uppercase;
    }

    .badge-req { background-color: var(--badge-req); }
    .badge-ui { background-color: var(--badge-ui); }
    .badge-code { background-color: var(--badge-code); }
    .badge-gap { background-color: var(--badge-gap); }

    .node-card-desc {
      font-size: 11px;
      color: var(--text-sub);
      word-break: break-all;
    }

    /* Node Detail Inspector Modal / Overlay */
    .inspector-panel {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      padding: 14px 20px;
      border-radius: 14px;
      max-width: 480px;
      width: 90%;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      display: none;
    }

    .inspector-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .inspector-title {
      font-weight: 700;
      font-size: 14px;
    }

    .close-btn {
      background: transparent;
      border: none;
      color: var(--text-sub);
      cursor: pointer;
      font-size: 16px;
    }

    .inspector-body {
      font-size: 12px;
      color: var(--text-sub);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Loading Overlay */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: var(--bg-color);
      z-index: 100;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid var(--panel-border);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Loading Overlay -->
  <div id="loading-screen">
    <div class="spinner"></div>
    <div style="font-weight: 600; font-size: 14px;" id="loading-text">Loading 3D Crystal Lattice Graph...</div>
  </div>

  <!-- 3D Canvas -->
  <div id="3d-graph"></div>

  <!-- Top Header Controls -->
  <div class="top-bar">
    <div class="brand-title">
      💎 <span>Blast Radius Explorer</span>
    </div>
    <div class="stats-badge" id="stats-counter">
      0 Nodes | 0 Links
    </div>
    <button class="btn" id="theme-toggle-btn" title="Toggle Light/Dark Theme">
      🌙 Theme
    </button>
    <div class="control-group" title="Adjust thickness of inter-layer edges (IMPLEMENTS, RENDERS, COVERS)">
      <label for="edge-width-slider">Edge Width:</label>
      <input type="range" id="edge-width-slider" min="1" max="10" value="3" step="0.5">
      <span id="edge-width-val" style="min-width: 28px; text-align: right;">3px</span>
    </div>
    <button class="btn" id="toggle-sectors-btn" title="Toggle 3D Sector Lassos & Group Labels">
      ⭕ Sectors: ON
    </button>
    <button class="btn" id="refresh-data-btn" title="Refresh Neo4j Data Cache">
      🔄 Refresh Cache
    </button>
    <button class="btn btn-primary" id="blast-sim-btn" title="Run Blast Radius Shockwave Simulation">
      ⚡ Blast Simulator
    </button>
  </div>

  <!-- Camera Presets -->
  <div class="camera-bar">
    <button class="btn" onclick="setCameraView('iso')" title="Isometric View">🌐 Iso</button>
    <button class="btn" onclick="setCameraView('req')" title="Requirement Layer (Z=+200)">📜 Requirements</button>
    <button class="btn" onclick="setCameraView('ui')" title="UI Layer (Z=0)">🖥️ UI Layer</button>
    <button class="btn" onclick="setCameraView('code')" title="Code Layer (Z=-200)">⚙️ Code Layer</button>
  </div>

  <!-- Right Explorer Sidebar -->
  <div class="sidebar" id="sidebar">
    <button class="sidebar-toggle" id="sidebar-toggle-btn" title="Toggle Explorer Sidebar">🔍</button>
    <div class="sidebar-header">
      <div style="font-weight: 700; font-size: 14px;">Node Explorer</div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" id="search-input" placeholder="Search by name, file, ID...">
      </div>
    </div>

    <!-- Layer Filter Tabs -->
    <div class="tabs">
      <button class="tab-btn active" onclick="filterLayer('all', this)">All</button>
      <button class="tab-btn" onclick="filterLayer('req', this)">Req</button>
      <button class="tab-btn" onclick="filterLayer('ui', this)">UI</button>
      <button class="tab-btn" onclick="filterLayer('code', this)">Code</button>
      <button class="tab-btn" onclick="filterLayer('gap', this)">Gap</button>
    </div>

    <!-- Scrollable Node List -->
    <div class="node-list" id="node-list"></div>
  </div>

  <!-- Node Inspector Box -->
  <div class="inspector-panel" id="inspector">
    <div class="inspector-header">
      <div class="inspector-title" id="inspector-name">Node Inspector</div>
      <button class="close-btn" onclick="closeInspector()">✕</button>
    </div>
    <div class="inspector-body" id="inspector-body"></div>
  </div>

  <script>
    const CACHE_KEY = 'blast_radius_3d_graph_cache_v2';
    let fullGraphData = { nodes: [], links: [] };
    let nodeMap = new Map();
    let filteredNodes = [];
    let currentLayerFilter = 'all';
    let activeSearchQuery = '';
    let Graph = null;
    let selectedNode = null;
    let blastSimulationActive = false;
    let interLayerEdgeWidth = 3;
    let sectorGroup = null;
    let sectorsVisible = true;

    const SECTOR_DEFINITIONS = [
      { id: 'doc', name: 'Document & Signing Sector', color: '#58a6ff', keywords: ['documen', 'sign', 'envelop', 'recip', 'pdf'] },
      { id: 'admin', name: 'Admin & Governance Sector', color: '#bc8cff', keywords: ['admin', 'organisat', 'team', 'group', 'setting', 'profile'] },
      { id: 'auth', name: 'Auth & Security Sector', color: '#3fb950', keywords: ['auth', 'passkey', 'user', 'permission', 'token'] },
      { id: 'integ', name: 'Integrations & Billing Sector', color: '#d29922', keywords: ['webhook', 'zapier', 'stripe', 'billing', 'email'] },
      { id: 'infra', name: 'Infrastructure & Storage Sector', color: '#f85149', keywords: ['docker', 'prisma', 'postgres', 'lingui', 'infra'] },
      { id: 'core', name: 'Core Application Sector', color: '#8b949e', keywords: [] }
    ];

    function getLayerSpecificSector(node) {
      const layer = node.layer || 'code';
      const text = (node.name + " " + node.id + " " + (node.properties?.file || node.properties?.url || '')).toLowerCase();

      if (layer === 'req' || layer === 'gap') {
        if (layer === 'gap') {
          return { id: 'req_gap', name: 'Uncovered Requirement Gaps', color: '#a32d2d' };
        }
        if (text.includes('auth') || text.includes('security') || text.includes('permission') || text.includes('key')) {
          return { id: 'req_auth', name: 'Security & Auth Requirements', color: '#3fb950' };
        }
        if (text.includes('stripe') || text.includes('billing') || text.includes('license') || text.includes('enterprise')) {
          return { id: 'req_billing', name: 'Billing & Enterprise Requirements', color: '#d29922' };
        }
        if (text.includes('docker') || text.includes('prisma') || text.includes('postgres') || text.includes('infra') || text.includes('host')) {
          return { id: 'req_infra', name: 'Infrastructure & Deployment', color: '#f85149' };
        }
        if (text.includes('email') || text.includes('notification') || text.includes('lingui') || text.includes('trpc')) {
          return { id: 'req_integ', name: 'Integration Requirements', color: '#bc8cff' };
        }
        return { id: 'req_core', name: 'Core Feature Requirements', color: '#7f77dd' };
      }

      if (layer === 'ui') {
        if (text.includes('setting') || text.includes('profile') || text.includes('account')) {
          return { id: 'ui_settings', name: 'Settings & Profile UI', color: '#58a6ff' };
        }
        if (text.includes('documen') || text.includes('sign') || text.includes('envelope')) {
          return { id: 'ui_signing', name: 'Document & Signing UI', color: '#1d9e75' };
        }
        if (text.includes('auth') || text.includes('login') || text.includes('passkey')) {
          return { id: 'ui_auth', name: 'Auth & Onboarding UI', color: '#3fb950' };
        }
        if (text.includes('admin') || text.includes('team') || text.includes('organisation')) {
          return { id: 'ui_admin', name: 'Admin & Team UI', color: '#bc8cff' };
        }
        return { id: 'ui_components', name: 'UI Components & Elements', color: '#2da44e' };
      }

      // Code Layer (layer === 'code')
      const file = (node.properties?.file || node.file || node.name || '').toLowerCase();
      if (file.includes('packages/trpc') || file.includes('router')) {
        return { id: 'code_trpc', name: 'tRPC API Routers', color: '#bc8cff' };
      }
      if (file.includes('server-only') || file.includes('backend')) {
        return { id: 'code_backend', name: 'Backend Business Logic', color: '#ba7517' };
      }
      if (file.includes('apps/remix') || file.includes('component')) {
        return { id: 'code_frontend', name: 'Remix Frontend UI Code', color: '#58a6ff' };
      }
      if (file.includes('email') || file.includes('webhook') || file.includes('job')) {
        return { id: 'code_jobs', name: 'Jobs & Integration Handlers', color: '#d29922' };
      }
      if (file.includes('prisma') || file.includes('util') || file.includes('lib')) {
        return { id: 'code_utils', name: 'Core Utilities & Data Models', color: '#8b949e' };
      }
      return { id: 'code_general', name: 'Application Code Modules', color: '#d97706' };
    }

    function getSectorForNode(node) {
      return getLayerSpecificSector(node);
    }

    function isInterLayerLink(link) {
      const srcId = typeof link.source === 'object' ? link.source.id : link.source;
      const tgtId = typeof link.target === 'object' ? link.target.id : link.target;
      const srcNode = nodeMap.get(srcId);
      const tgtNode = nodeMap.get(tgtId);
      return (srcNode && tgtNode && srcNode.layer !== tgtNode.layer) ||
             ['IMPLEMENTS', 'RENDERS', 'COVERS'].includes(link.rel_type);
    }

    function getLinkWidth(link) {
      return isInterLayerLink(link) ? parseFloat(interLayerEdgeWidth) : 1;
    }

    // Theme Management
    function initTheme() {
      const savedTheme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
      updateThemeButtonText(savedTheme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
      updateThemeButtonText(next);
      
      if (Graph) {
        Graph.backgroundColor(next === 'dark' ? '#0b0c10' : '#f8f9fa');
      }
    }

    function updateThemeButtonText(theme) {
      document.getElementById('theme-toggle-btn').innerText = theme === 'dark' ? '☀️ Light' : '🌙 Dark';
    }

    document.getElementById('theme-toggle-btn').addEventListener('click', toggleTheme);

    // Edge Width Slider Control
    document.getElementById('edge-width-slider').addEventListener('input', (e) => {
      interLayerEdgeWidth = e.target.value;
      document.getElementById('edge-width-val').innerText = interLayerEdgeWidth + 'px';
      if (Graph) {
        Graph.linkWidth(link => getLinkWidth(link));
      }
    });

    // Sectors Toggle Button
    document.getElementById('toggle-sectors-btn').addEventListener('click', () => {
      sectorsVisible = !sectorsVisible;
      document.getElementById('toggle-sectors-btn').innerText = sectorsVisible ? '⭕ Sectors: ON' : '⭕ Sectors: OFF';
      if (sectorGroup) {
        sectorGroup.visible = sectorsVisible;
      } else if (sectorsVisible) {
        drawSectorLassos();
      }
    });

    // Dynamic Data Fetcher with Local Caching and file:// fallback
    async function loadGraphData(forceRefresh = false) {
      const loadingScreen = document.getElementById('loading-screen');
      const loadingText = document.getElementById('loading-text');
      loadingScreen.style.opacity = '1';
      loadingScreen.style.pointerEvents = 'all';

      if (!forceRefresh) {
        // 1. Check window.GRAPH_DATA from local script tag first
        if (window.GRAPH_DATA && window.GRAPH_DATA.nodes && window.GRAPH_DATA.nodes.length > 0) {
          console.log('[Script Tag] Loaded graph data from window.GRAPH_DATA');
          fullGraphData = window.GRAPH_DATA;
          localStorage.setItem(CACHE_KEY, JSON.stringify(fullGraphData));
          renderGraph();
          return;
        }

        // 2. Check localStorage cache
        const cached = localStorage.getItem(CACHE_KEY);
        if (cached) {
          try {
            const parsed = JSON.parse(cached);
            if (parsed.nodes && parsed.nodes.length > 0) {
              console.log('[Cache] Loaded graph data from localStorage');
              fullGraphData = parsed;
              renderGraph();
              return;
            }
          } catch(e) {
            console.warn('[Cache] Corrupted cache, fetching fresh dataset', e);
          }
        }
      }

      loadingText.innerText = 'Loading graph data...';
      try {
        const resp = await fetch('./graph_data.json');
        if (!resp.ok) throw new Error(`HTTP error! status: ${resp.status}`);
        fullGraphData = await resp.json();
        
        // Save to cache
        localStorage.setItem(CACHE_KEY, JSON.stringify(fullGraphData));
        console.log(`[Fetch] Cached ${fullGraphData.nodes.length} nodes to localStorage`);
      } catch (err) {
        console.warn('[Fetch Warning] Local fetch failed/blocked by CORS. Falling back to window.GRAPH_DATA:', err);
        if (window.GRAPH_DATA && window.GRAPH_DATA.nodes) {
          fullGraphData = window.GRAPH_DATA;
          localStorage.setItem(CACHE_KEY, JSON.stringify(fullGraphData));
        }
      }

      renderGraph();
    }

    document.getElementById('refresh-data-btn').addEventListener('click', () => {
      loadGraphData(true);
    });

    // Sidebar Controls
    const sidebar = document.getElementById('sidebar');
    document.getElementById('sidebar-toggle-btn').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // Render 3D Force Graph
    function renderGraph() {
      const container = document.getElementById('3d-graph');
      container.innerHTML = '';

      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';

      // Build quick lookup map for nodes
      nodeMap = new Map(fullGraphData.nodes.map(n => [n.id, n]));

      // Update Stats
      document.getElementById('stats-counter').innerText = 
        `${fullGraphData.nodes.length} Nodes | ${fullGraphData.links.length} Links`;

      // Filtered nodes baseline
      filteredNodes = fullGraphData.nodes;

      Graph = ForceGraph3D()(container)
        .graphData(fullGraphData)
        .backgroundColor(isDark ? '#0b0c10' : '#f8f9fa')
        .nodeId('id')
        .nodeLabel(node => {
          const sec = getLayerSpecificSector(node);
          return `<div style="color:#fff; background:rgba(15,23,42,0.9); padding:6px 10px; border-radius:6px; border:1px solid ${sec.color};">
            <b>${node.name}</b> (${node.node_type})<br/>
            <span style="font-size:11px; color:#94a3b8;">Layer Sector: ${sec.name}</span>
          </div>`;
        })
        .nodeColor(node => node.color || getLayerSpecificSector(node).color)
        .nodeVal(node => {
          if (node.layer === 'req') return 12;
          if (node.layer === 'ui') return 8;
          return 4;
        })
        .linkWidth(link => getLinkWidth(link))
        .linkColor(link => {
          const isInter = isInterLayerLink(link);
          if (isInter) {
            if (link.rel_type === 'IMPLEMENTS') return isDark ? 'rgba(127, 119, 221, 0.7)' : 'rgba(102, 92, 215, 0.7)';
            if (link.rel_type === 'RENDERS') return isDark ? 'rgba(29, 158, 117, 0.7)' : 'rgba(20, 128, 94, 0.7)';
            if (link.rel_type === 'COVERS') return isDark ? 'rgba(88, 166, 255, 0.7)' : 'rgba(9, 105, 218, 0.7)';
          }
          return isDark ? 'rgba(255,255,255,0.12)' : 'rgba(0,0,0,0.10)';
        })
        .linkDirectionalParticles(2)
        .linkDirectionalParticleWidth(link => isInterLayerLink(link) ? 3 : 1)
        .linkDirectionalParticleSpeed(0.005)
        .onEngineStop(() => drawSectorLassos())
        .onNodeClick(node => {
          focusNode(node);
        });

      // Add 3D Layer Planes (Glassmorphism Tier Visualizers at Z = +200, 0, -200)
      addLayerPlanes();

      // Schedule Sector Lassos calculation after initial layout warm up
      setTimeout(() => drawSectorLassos(), 2500);

      // Initial Sidebar Populate
      updateNodeList();

      // Hide Loading Screen
      const loadingScreen = document.getElementById('loading-screen');
      loadingScreen.style.opacity = '0';
      setTimeout(() => loadingScreen.style.pointerEvents = 'none', 500);
    }

    // Add semi-transparent 3D Layer Planes (Dynamically expanded to fit max node spread)
    let layerPlanesGroup = null;

    function addLayerPlanes() {
      if (!Graph) return;
      const scene = Graph.scene();

      if (layerPlanesGroup) {
        scene.remove(layerPlanesGroup);
      }
      layerPlanesGroup = new THREE.Group();

      // Calculate max node 2D spread across graph
      let maxAbsX = 300;
      let maxAbsY = 300;
      fullGraphData.nodes.forEach(n => {
        const absX = Math.abs(n.x || 0);
        const absY = Math.abs(n.y || 0);
        if (absX > maxAbsX) maxAbsX = absX;
        if (absY > maxAbsY) maxAbsY = absY;
      });

      // Expand square planes dynamically to enclose the layout spread
      const maxSpread = Math.max(maxAbsX, maxAbsY);
      const planeSize = Math.max(750, Math.ceil((maxSpread * 2 + 160) / 100) * 100);
      const gridDivisions = Math.min(80, Math.max(20, Math.floor(planeSize / 35)));

      const layers = [
        { z: 200, color: 0x7f77dd, label: `Requirement Layer (Z=+200, Size=${planeSize})` },
        { z: 0, color: 0x1d9e75, label: `UI Layer (Z=0, Size=${planeSize})` },
        { z: -200, color: 0xba7517, label: `Code Layer (Z=-200, Size=${planeSize})` }
      ];

      layers.forEach(l => {
        const planeGeo = new THREE.PlaneGeometry(planeSize, planeSize);
        const planeMat = new THREE.MeshBasicMaterial({
          color: l.color,
          transparent: true,
          opacity: 0.06,
          side: THREE.DoubleSide
        });
        const planeMesh = new THREE.Mesh(planeGeo, planeMat);
        planeMesh.position.z = l.z;
        layerPlanesGroup.add(planeMesh);

        // Grid helper dynamically matched to plane size
        const grid = new THREE.GridHelper(planeSize, gridDivisions, l.color, l.color);
        grid.rotation.x = Math.PI / 2;
        grid.position.z = l.z;
        grid.material.opacity = 0.15;
        grid.material.transparent = true;
        layerPlanesGroup.add(grid);
      });

      scene.add(layerPlanesGroup);
    }

    // Draw 3D Layer-Specific Sector Lassos around node groups in each layer plane
    function drawSectorLassos() {
      if (!Graph) return;
      const scene = Graph.scene();

      if (sectorGroup) {
        scene.remove(sectorGroup);
      }

      sectorGroup = new THREE.Group();
      sectorGroup.visible = sectorsVisible;

      const layerPlanes = [
        { z: 200, name: 'req' },
        { z: 0, name: 'ui' },
        { z: -200, name: 'code' }
      ];

      layerPlanes.forEach(lp => {
        const sectorMap = new Map();

        fullGraphData.nodes.forEach(n => {
          const nodeZ = n.z !== undefined ? n.z : (n.fz !== undefined ? n.fz : 0);
          if (Math.abs(nodeZ - lp.z) < 50) {
            const sec = getLayerSpecificSector(n);
            if (!sectorMap.has(sec.id)) {
              sectorMap.set(sec.id, { sec: sec, nodes: [] });
            }
            sectorMap.get(sec.id).nodes.push(n);
          }
        });

        sectorMap.forEach(({ sec, nodes }) => {
          if (nodes.length < 2) return; // skip isolated singletons

          let sumX = 0, sumY = 0;
          nodes.forEach(n => {
            sumX += (n.x || 0);
            sumY += (n.y || 0);
          });
          const centerX = sumX / nodes.length;
          const centerY = sumY / nodes.length;

          let maxDistSq = 0;
          nodes.forEach(n => {
            const dx = (n.x || 0) - centerX;
            const dy = (n.y || 0) - centerY;
            const distSq = dx * dx + dy * dy;
            if (distSq > maxDistSq) maxDistSq = distSq;
          });

          const radius = Math.max(Math.sqrt(maxDistSq) + 24, 40);

          // Outer Lasso Ring
          const ringGeo = new THREE.RingGeometry(radius - 2.5, radius + 2.5, 64);
          const ringMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(sec.color),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.80
          });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.position.set(centerX, centerY, lp.z + 1);
          sectorGroup.add(ringMesh);

          // Inner Translucent Shading Disk
          const fillGeo = new THREE.RingGeometry(0, radius - 2.5, 64);
          const fillMat = new THREE.MeshBasicMaterial({
            color: new THREE.Color(sec.color),
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.08
          });
          const fillMesh = new THREE.Mesh(fillGeo, fillMat);
          fillMesh.position.set(centerX, centerY, lp.z + 0.5);
          sectorGroup.add(fillMesh);

          // Sector Label Billboard Sprite
          const sprite = createTextSprite(sec.name, sec.color);
          sprite.position.set(centerX, centerY + radius + 16, lp.z + 6);
          sectorGroup.add(sprite);
        });
      });

      scene.add(sectorGroup);

      // Dynamically expand layer planes to fit the layout bounds
      addLayerPlanes();
    }

    function createTextSprite(text, colorHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = 'rgba(15, 23, 42, 0.88)';
      ctx.strokeStyle = colorHex;
      ctx.lineWidth = 6;
      ctx.beginPath();
      if (ctx.roundRect) {
        ctx.roundRect(10, 10, 492, 108, 16);
      } else {
        ctx.rect(10, 10, 492, 108);
      }
      ctx.fill();
      ctx.stroke();

      ctx.font = 'bold 22px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif';
      ctx.fillStyle = '#ffffff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, 256, 64);

      const texture = new THREE.CanvasTexture(canvas);
      texture.needsUpdate = true;
      const spriteMat = new THREE.SpriteMaterial({ map: texture, transparent: true });
      const sprite = new THREE.Sprite(spriteMat);
      sprite.scale.set(80, 20, 1);
      return sprite;
    }

    // Focus Node in 3D Space
    function focusNode(node) {
      selectedNode = node;
      const distance = 120;
      const distRatio = 1 + distance/Math.hypot(node.x || 0, node.y || 0, node.z || node.fz || 0);

      Graph.cameraPosition(
        { x: (node.x || 0) * distRatio, y: (node.y || 0) * distRatio, z: ((node.z || node.fz || 0) + 60) },
        node,
        1500
      );

      // Open Inspector
      openInspector(node);
    }

    // Camera Presets
    function setCameraView(preset) {
      if (!Graph) return;
      if (preset === 'iso') {
        Graph.cameraPosition({ x: 300, y: 300, z: 400 }, { x: 0, y: 0, z: 0 }, 1200);
      } else if (preset === 'req') {
        Graph.cameraPosition({ x: 0, y: 1, z: 450 }, { x: 0, y: 0, z: 200 }, 1200);
      } else if (preset === 'ui') {
        Graph.cameraPosition({ x: 0, y: 1, z: 250 }, { x: 0, y: 0, z: 0 }, 1200);
      } else if (preset === 'code') {
        Graph.cameraPosition({ x: 0, y: 1, z: 50 }, { x: 0, y: 0, z: -200 }, 1200);
      }
    }

    // Sidebar Filtering Logic
    function filterLayer(layer, btnElem) {
      currentLayerFilter = layer;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      if (btnElem) btnElem.classList.add('active');
      updateNodeList();
    }

    document.getElementById('search-input').addEventListener('input', (e) => {
      activeSearchQuery = e.target.value.toLowerCase().trim();
      updateNodeList();
    });

    function updateNodeList() {
      const listContainer = document.getElementById('node-list');
      listContainer.innerHTML = '';

      filteredNodes = fullGraphData.nodes.filter(node => {
        const matchesLayer = (currentLayerFilter === 'all') || (node.layer === currentLayerFilter);
        const matchesQuery = !activeSearchQuery || 
          (node.name && node.name.toLowerCase().includes(activeSearchQuery)) ||
          (node.id && node.id.toLowerCase().includes(activeSearchQuery)) ||
          (node.node_type && node.node_type.toLowerCase().includes(activeSearchQuery));
        
        return matchesLayer && matchesQuery;
      });

      // Display top 100 matching cards for smooth rendering
      filteredNodes.slice(0, 100).forEach(node => {
        const sec = getLayerSpecificSector(node);
        const card = document.createElement('div');
        card.className = 'node-card';
        card.onclick = () => focusNode(node);

        const badgeClass = `badge-${node.layer || 'code'}`;
        card.innerHTML = `
          <div class="node-card-title">
            <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 220px;">${node.name}</span>
            <span class="node-badge ${badgeClass}">${node.node_type}</span>
          </div>
          <div class="node-card-desc">Sector: ${sec.name} | Z=${node.fz}</div>
        `;
        listContainer.appendChild(card);
      });
    }

    // Inspector Overlay
    function openInspector(node) {
      const inspector = document.getElementById('inspector');
      const title = document.getElementById('inspector-name');
      const body = document.getElementById('inspector-body');

      title.innerText = node.name;
      const sec = getLayerSpecificSector(node);
      
      let propsHtml = `<div><b>Node ID:</b> ${node.id}</div>`;
      propsHtml += `<div><b>Type:</b> ${node.node_type} (${node.layer.toUpperCase()})</div>`;
      propsHtml += `<div><b>Layer Sector:</b> ${sec.name}</div>`;
      propsHtml += `<div><b>Z-Plane:</b> ${node.fz}</div>`;
      
      if (node.properties) {
        Object.entries(node.properties).forEach(([k, v]) => {
          propsHtml += `<div><b>${k}:</b> ${v}</div>`;
        });
      }

      body.innerHTML = propsHtml;
      inspector.style.display = 'block';
    }

    function closeInspector() {
      document.getElementById('inspector').style.display = 'none';
    }

    // Blast Simulator Shockwave Mode (Traces connected impact paths from selected node)
    document.getElementById('blast-sim-btn').addEventListener('click', () => {
      if (!selectedNode) {
        alert('Please click and select a node first to simulate its blast radius impact!');
        return;
      }
      
      blastSimulationActive = true;
      const selectedId = selectedNode.id;

      // Find 1-hop and 2-hop connected links radiating from selected node
      const impactedLinks = new Set();
      const connectedNodeIds = new Set([selectedId]);

      fullGraphData.links.forEach(l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        if (sId === selectedId || tId === selectedId) {
          impactedLinks.add(l);
          connectedNodeIds.add(sId);
          connectedNodeIds.add(tId);
        }
      });

      // 2-hop propagation
      fullGraphData.links.forEach(l => {
        const sId = typeof l.source === 'object' ? l.source.id : l.source;
        const tId = typeof l.target === 'object' ? l.target.id : l.target;
        if (connectedNodeIds.has(sId) || connectedNodeIds.has(tId)) {
          impactedLinks.add(l);
        }
      });

      // Launch particle shockwave specifically along impact paths
      Graph.linkDirectionalParticles(link => impactedLinks.has(link) ? 8 : 1)
           .linkDirectionalParticleWidth(link => impactedLinks.has(link) ? 5 : 1)
           .linkDirectionalParticleSpeed(link => impactedLinks.has(link) ? 0.025 : 0.003);

      setTimeout(() => {
        Graph.linkDirectionalParticles(2)
             .linkDirectionalParticleWidth(link => isInterLayerLink(link) ? 3 : 1)
             .linkDirectionalParticleSpeed(0.005);
        blastSimulationActive = false;
      }, 6000);
    });

    // Initialize Page
    window.addEventListener('DOMContentLoaded', () => {
      initTheme();
      loadGraphData();
    });
  </script>
</body>
