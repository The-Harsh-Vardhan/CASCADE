version: "3.9"

services:
  neo4j:
    image: neo4j:5.14-community
    container_name: blast-radius-neo4j
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt (app connection)
    environment:
      NEO4J_AUTH: neo4j/password
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s

volumes:
  neo4j_data:
  neo4j_logs:
